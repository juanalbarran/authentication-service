# authentication-service/.tmux-init.conf
# Builds this project's whole tmux session. sarisarinama's open-project runs
# it as a bash script with SESSION, selected_path and bash_path set, and it
# must create the session $SESSION itself.
#
# Each app goes on the same line as `devenv shell`, so it starts once the env
# is ready, without sleeps. The server and database scripts (devenv.nix) wait
# for the Postgres that `devenv up` starts in the services window.

# Evaluate the env once before the windows start it: several devenv commands
# evaluating a fresh .devenv at the same time fail on its eval cache ("disk
# I/O error"). Takes under a second when nothing changed.
(cd "$selected_path" && devenv shell true >/dev/null 2>&1)

tmux new-session -d -s "$SESSION" -n "claudio" -c "$selected_path" "claude; exec $bash_path"

tmux new-window -t "$SESSION" -n "editor" -c "$selected_path" "exec $bash_path"
tmux send-keys -t "$SESSION:editor" "devenv shell nvim-java" C-m

tmux new-window -t "$SESSION" -n "console" -c "$selected_path" "exec $bash_path"
tmux send-keys -t "$SESSION:console" "fastfetch; devenv shell" C-m

# <leader>jR in nvim-java restarts the app here (C-c, then Up Enter)
tmux new-window -t "$SESSION" -n "server" -c "$selected_path" "exec $bash_path"
tmux send-keys -t "$SESSION:server" "devenv shell server" C-m

tmux new-window -t "$SESSION" -n "database" -c "$selected_path" "exec $bash_path"
tmux send-keys -t "$SESSION:database" "devenv shell db" C-m

tmux new-window -t "$SESSION" -n "lazygit" -c "$selected_path" "lazygit; exec $bash_path"

tmux new-window -t "$SESSION" -n "services" -c "$selected_path" "exec $bash_path"
tmux send-keys -t "$SESSION:services" "devenv up" C-m

tmux select-window -t "$SESSION:editor"
